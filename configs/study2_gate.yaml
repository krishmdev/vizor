# Study 2 validation gate (docs/bench-design-study2.md, "Validation gate"). Re-scores the
# pre-registered Study 1 run with attribution propensity on qwen2.5-3b-mlx4 served by Localhost AI.
# Study 1's baseline samples 0 and 1 (generated by Ollama's GGUF weights) are used only as
# reference text; no Study 1 number is replaced. Committed before the gate runs; do not edit after.
#
#   scripts/validation_gate.py --run experiments/results/2026-09-05_bench-qwen3b \
#     --config configs/study2_gate.yaml --out experiments/results/<date>_study2-gate \
#     --server-commit <localhost-ai HEAD>
label: "Study 2 validation gate: AP on Study 1 (qwen2.5-3b-mlx4 via Localhost AI)"
project: data/bench/project.yaml
score:
  backend: localhost
  model: qwen2.5-3b-mlx4
  base_url: http://127.0.0.1:8431
  server_meta:
    server: localhost-ai
    preset: qwen2.5-3b-mlx4
  refs: [0, 1]
  bootstrap: 5000
  draws: 20000
  workers: 1
  comparisons:
    - {name: "pinned:metadata", set: "content:metadata", family: pinned}
    - {name: "pinned:faq_rewrite", set: "content:faq_rewrite", family: pinned}
    - {name: "pinned:jsonld_insert", set: "content:jsonld_insert", family: pinned}
    - {name: "pinned:internal_links", set: "content:internal_links", family: pinned}
    - {name: "pinned:stats_surface", set: "content:stats_surface", family: pinned}
    - {name: "pinned:keyword_stuffing", set: "content:keyword_stuffing", family: pinned}
    - {name: "full:metadata", set: "metadata", family: full}
    - {name: "full:faq_rewrite", set: "faq_rewrite", family: full}
    - {name: "full:jsonld_insert", set: "jsonld_insert", family: full}
    - {name: "full:internal_links", set: "internal_links", family: full}
    - {name: "full:stats_surface", set: "stats_surface", family: full}
    - {name: "full:keyword_stuffing", set: "keyword_stuffing", family: full}
    - {name: "rank:faq_rewrite", set: "faq_rewrite", ref: "content:faq_rewrite", family: rank}
    - {name: "aa_resample", set: aa_resample, family: control}
    - {name: "slot 5 vs 1", set: "engine:target_at:5", ref: "engine:target_at:1", family: slot}
gate:
  slot: "slot 5 vs 1"
  faq_ap: "pinned:faq_rewrite"
  faq_c_share: "content:faq_rewrite"
  slot_alpha: 0.01
  # criterion 3 (amended 2026-09-18): C-SoV's |d| / CI half-width may be at most 0.6 x AP's
  ci_ratio: 0.6
  # criterion 4 (amended 2026-09-18): content-pinned arms only; rho / sqrt(rel) >= 0.5, rho > 0,
  # one-sided page-permutation p < 0.05. rel = 1 - 122.71 / 171.38 from Study 1's stored C-SoV
  # (A/A page-delta variance over the pooled content-arm page-delta variance).
  spearman: 0.5
  rel: 0.284
  spearman_alpha: 0.05
  mde_family: 3
  pairs:
    "pinned:metadata": "content:metadata"
    "pinned:faq_rewrite": "content:faq_rewrite"
    "pinned:jsonld_insert": "content:jsonld_insert"
    "pinned:internal_links": "content:internal_links"
    "pinned:stats_surface": "content:stats_surface"
    "pinned:keyword_stuffing": "content:keyword_stuffing"
