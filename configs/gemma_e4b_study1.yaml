# Gemma 4 E4B replication, part 1 (docs/bench-design-study2.md, second amendment, item 3).
# Study 1's key arms on Study 1's queries with gemma-4-e4b-mlx4 served by Localhost AI, thinking
# off, 3 samples. Committed before any Gemma call; not edited after.
#
#   vizor experiment --config configs/gemma_e4b_study1.yaml --server-commit <sha> \
#     --out experiments/results/<date>_gemma-e4b-study1
label: "Gemma 4 E4B replication of Study 1's key arms (gemma-4-e4b-mlx4 via Localhost AI)"
project: data/bench/project.yaml
embedder: bge
reranker: cross-encoder
sentiment: vader
samples: 3
seed: 0
llm:
  backend: openai_compat
  model: gemma-4-e4b-mlx4
  base_url: http://127.0.0.1:8431/v1
  temperature: 0.7
  max_tokens: 450
  workers: 1
  chat_template_kwargs: {enable_thinking: false}
  server_meta:
    server: localhost-ai
    preset: gemma-4-e4b-mlx4
  # System prompt A from Study 1, word for word
  system_prompt: >-
    You answer questions using numbered search results. Write short sentences. Put a citation in
    square brackets at the end of EVERY sentence, right before the period, naming the search result
    that supports that sentence. Format example, with made-up facts unrelated to any question:
    "The Harrow kettle holds 1.7 litres [2]. It ships in three colours [2]. The Linden toaster has
    four slots [4]." Never collect citations at the end of the answer.
sandbox:
  primary_metric: c_share
  # Study 1's weighting and tests; faq_rewrite is the only page arm, so Holm has nothing to adjust
  arms: [noop, aa_resample, faq_rewrite, content:faq_rewrite]
  position_sweep: [1, 5]
  boost_sweep: []
  sweep_queries: 36
bandit:
  greedy_steps: 0
