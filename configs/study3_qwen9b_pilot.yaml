# Study 3 pilot (docs/bench-design-study3.md, "Pilot and MDE"): the baseline, noop and the A/A
# re-sample at 2 samples on the Study 3 queries, with exactly the main run's model, server
# settings, prompt and seeds, to measure the 9B's A/A page SD, the MDE and the time per answer
# before the main run. The main run reuses these answers from the cache. Committed before any
# Study 3 call.
#
#   vizor experiment --config configs/study3_qwen9b_pilot.yaml --server-commit <sha> \
#     --out experiments/results/<date>_study3-pilot
label: "Study 3 pilot: qwen3.5-9b-mlx4 via Localhost AI, baseline and A/A at 2 samples"
project: data/bench/project_study3.yaml
embedder: bge
reranker: cross-encoder
sentiment: vader  # the 9B model leaves little memory; skip the roberta sentiment model
samples: 2
seed: 0
llm:
  backend: openai_compat
  model: qwen3.5-9b-mlx4
  base_url: http://127.0.0.1:8431/v1
  temperature: 0.7
  max_tokens: 450
  workers: 1
  chat_template_kwargs: {enable_thinking: false}
  server_meta:
    server: localhost-ai
    preset: qwen3.5-9b-mlx4
  system_prompt: >-
    You answer questions using numbered search results. Write short sentences. Put a citation in
    square brackets at the end of EVERY sentence, right before the period, naming the search result
    that supports that sentence. Format example, with made-up facts unrelated to any question:
    "The Harrow kettle holds 1.7 litres [2]. It ships in three colours [2]. The Linden toaster has
    four slots [4]." Never collect citations at the end of the answer.
sandbox:
  primary_metric: c_share
  weighting: page
  arms: [noop, aa_resample]
  position_sweep: []
  boost_sweep: []
render:
  passage_policy: query-top3
bandit:
  greedy_steps: 0
score:
  draws: 20000
