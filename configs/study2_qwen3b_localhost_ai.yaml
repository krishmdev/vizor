# Study 2, pre-registered (docs/bench-design-study2.md). qwen2.5-3b-mlx4 served by Localhost AI
# for the sampled answers, the page rewrites (temperature 0) and the teacher-forced scoring, on
# the bench corpus with the 72 Study 2 queries. Committed before any Study 2 run; not edited after.
#
#   vizor experiment --config configs/study2_qwen3b_localhost_ai.yaml --server-commit <sha> \
#     --out experiments/results/<date>_study2-qwen3b
#   vizor score experiments/results/<date>_study2-qwen3b \
#     --config configs/study2_qwen3b_localhost_ai.yaml --server-commit <sha>
label: "Study 2: qwen2.5-3b-mlx4 via Localhost AI, bench corpus, Study 2 queries (pre-registered)"
project: data/bench/project_study2.yaml
embedder: bge
reranker: cross-encoder
sentiment: vader
samples: 3
seed: 0
llm:
  backend: openai_compat
  model: qwen2.5-3b-mlx4
  base_url: http://127.0.0.1:8431/v1
  temperature: 0.7
  max_tokens: 450
  workers: 1
  server_meta:
    server: localhost-ai
    preset: qwen2.5-3b-mlx4
  system_prompt: >-
    You answer questions using numbered search results. Write short sentences. Put a citation in
    square brackets at the end of EVERY sentence, right before the period, naming the search result
    that supports that sentence. Format example, with made-up facts unrelated to any question:
    "The Harrow kettle holds 1.7 litres [2]. It ships in three colours [2]. The Linden toaster has
    four slots [4]." Never collect citations at the end of the answer.
rewriter:
  backend: openai_compat
  model: qwen2.5-3b-mlx4
  base_url: http://127.0.0.1:8431/v1
  temperature: 0.0
  max_tokens: 1500
  server_meta:
    server: localhost-ai
    preset: qwen2.5-3b-mlx4
sandbox:
  primary_metric: c_share
  weighting: page
  arms: [noop, aa_resample, answer_first, evidence_surface_llm, faq_rewrite_v2]
  # positive control: the same pages with the target forced into the first or the last slot
  position_sweep: [1, 5]
  boost_sweep: []
  sweep_queries: 36
render:
  passage_policy: query-top3
bandit:
  greedy_steps: 0
score:
  backend: localhost
  model: qwen2.5-3b-mlx4
  base_url: http://127.0.0.1:8431
  server_meta:
    server: localhost-ai
    preset: qwen2.5-3b-mlx4
  refs: [0, 1]
  # prompt-only sets: the content-pinned twins, and every page arm re-rendered under body-top3
  prompt_arms: [content:answer_first, content:evidence_surface_llm, content:faq_rewrite_v2]
  policies: [body-top3]
  bootstrap: 5000
  draws: 20000
  workers: 1
  comparisons:
    # primary: content-pinned AP, Holm over these three (docs/bench-design-study2.md)
    - {name: "pinned:answer_first", set: "content:answer_first", family: primary}
    - {name: "pinned:evidence_surface_llm", set: "content:evidence_surface_llm", family: primary}
    - {name: "pinned:faq_rewrite_v2", set: "content:faq_rewrite_v2", family: primary}
    # secondary, reported without claims
    - {name: "full:answer_first", set: "answer_first", family: full}
    - {name: "full:evidence_surface_llm", set: "evidence_surface_llm", family: full}
    - {name: "full:faq_rewrite_v2", set: "faq_rewrite_v2", family: full}
    - {name: "rank:answer_first", set: "answer_first", ref: "content:answer_first", family: rank}
    - {name: "rank:evidence_surface_llm", set: "evidence_surface_llm", ref: "content:evidence_surface_llm", family: rank}
    - {name: "rank:faq_rewrite_v2", set: "faq_rewrite_v2", ref: "content:faq_rewrite_v2", family: rank}
    - {name: "body-top3:answer_first", set: "content:answer_first@body-top3", ref: "baseline@body-top3", family: body-top3}
    - {name: "body-top3:evidence_surface_llm", set: "content:evidence_surface_llm@body-top3", ref: "baseline@body-top3", family: body-top3}
    - {name: "body-top3:faq_rewrite_v2", set: "content:faq_rewrite_v2@body-top3", ref: "baseline@body-top3", family: body-top3}
    - {name: "aa_resample", set: aa_resample, family: control}
    - {name: "noop", set: noop, family: control}
    - {name: "slot 5 vs 1", set: "engine:target_at:5", ref: "engine:target_at:1", family: slot}
