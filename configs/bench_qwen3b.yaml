# Pre-registered main run (docs/bench-design.md): qwen2.5:3b-instruct through Ollama on the bike
# commuting bench corpus. 72 queries x 5 samples, 24 target pages. Do not change this file after
# the run has started; robustness variants live in their own configs.
label: "qwen2.5:3b-instruct via Ollama, bench corpus (pre-registered main run)"
project: data/bench/project.yaml
embedder: bge
reranker: cross-encoder
sentiment: auto
samples: 5
seed: 0
llm:
  backend: ollama
  model: qwen2.5:3b-instruct
  base_url: http://localhost:11434
  temperature: 0.7
  max_tokens: 450
  workers: 1
  # System prompt A. The example sentences are about kitchen appliances so they share no facts
  # or product type with the corpus.
  system_prompt: >-
    You answer questions using numbered search results. Write short sentences. Put a citation in
    square brackets at the end of EVERY sentence, right before the period, naming the search result
    that supports that sentence. Format example, with made-up facts unrelated to any question:
    "The Harrow kettle holds 1.7 litres [2]. It ships in three colours [2]. The Linden toaster has
    four slots [4]." Never collect citations at the end of the answer.
sandbox:
  primary_metric: c_share
  arms: [noop, aa_resample,
         metadata, faq_rewrite, jsonld_insert, internal_links, stats_surface, keyword_stuffing,
         content:metadata, content:faq_rewrite, content:jsonld_insert, content:internal_links,
         content:stats_surface, content:keyword_stuffing]
  # positive control: the same pages with the target forced into the first or the last slot
  position_sweep: [1, 5]
  boost_sweep: []
  sweep_queries: 36
bandit:
  greedy_steps: 0
