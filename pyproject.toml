[project]
name = "vizor"
version = "0.2.0"
description = "A local sandbox for studying citations and brand mentions in source-grounded model answers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Krish Maheshwari", email = "maheshwari.kri@northeastern.edu" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=8.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "trafilatura>=1.12",
    "extruct>=0.17",
    "warcio>=1.7",
    "vaderSentiment>=3.3.2",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
ui = ["streamlit>=1.38", "plotly>=5.23"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
vizor = "vizor.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vizor"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/reference/geo_reference.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# markdown/CSS templates and UI copy: long strings read better unwrapped
"src/vizor/metrics/report.py" = ["E501"]
"src/vizor/dashboard/app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the downloaded HF models",
    "network: talks to the internet",
]
addopts = "-q"
